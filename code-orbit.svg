<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img"><title>code orbit</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111F"/><stop offset="1" stop-color="#102C4B"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#38BDF8" opacity=".07"/></pattern></defs><rect width="960" height="280" rx="18" fill="url(#bg)"/><rect width="960" height="280" rx="18" fill="url(#grid)"/><rect x="1" y="1" width="958" height="278" rx="18" fill="none" stroke="#24527B"/><g font-family="Consolas,monospace"><text x="40" y="52" font-size="15" fill="#38BDF8" >IDEA → CÓDIGO → SOLUCIÓN</text><text x="40" y="128" font-size="42" fill="#F0F9FF" font-weight="700">BUILD. LEARN.</text><text x="40" y="181" font-size="42" fill="#38BDF8" font-weight="700">REPEAT.</text><text x="40" y="234" font-size="17" fill="#94AFC6" >Pequeños avances. Proyectos reales.</text><g transform="translate(760 140)"><circle r="89" stroke="#24527B" fill="none"/><circle r="62" stroke="#24527B" fill="none"/><text text-anchor="middle" y="15" font-size="48" fill="#38BDF8">&lt;/&gt;</text><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/><circle cx="89" r="8" fill="#22D3EE"/><circle cx="-62" r="5" fill="#3B82F6"/></g></g></g></svg>